server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:3000;
        # Overwrite (not append) so a client can't forge its IP for the API's rate limiter
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }

    # Client-side routes (/shows/:id, /bookings/:id, ...) all load index.html
    location / {
        try_files $uri /index.html;
    }
}
